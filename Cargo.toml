[lib]
crate-type = ["rlib"]
proc-macro = false

[features]
backtrace = []
built = []
dialog = ["e-utils/dialog"]
panic = [
  "backtrace",
  "tokio",
  "tokio/sync",
  "parking_lot",
  "dialog",
  "windows-sys/Win32_System_Console",
  "windows-sys/Win32_Foundation",
  "e-utils/once_cell",
  "e-utils/parse",
]
tracing-appender = [
  "tracing-subscriber/fmt",
  "tracing-subscriber/std",
  "tracing-subscriber",
  "thiserror",
  "crossbeam-channel",
  "time",
]
tracing = ["dep:tracing"]
log = ["dep:log"]
# 让 log 路径下的 preload 日志宏也接受 `tag=…` 写法（与 tracing 路径同名同义）。
# 必须同时启用 tracing:tag 结构体字段这个概念只存在于 tracing。
# 只给确实要传 tag 的业务 crate 开（如各 *-core 的 logger.rs）。
_tag = ["log", "tracing", "_tag_any"]
# 供 example 声明 required-features 用（两者任一即可，Cargo 不支持 OR 表达）
_tag_any = ["log", "tracing"]
default = [
  # "tracing-appender",
  # "tracing-subscriber",
  # "panic",
  # "dialog",
  # "tracing",
  "log"
]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "registry",
  "json",
  "chrono",
], optional = true }
tracing-log = { version = "0.2", optional = true }
e-utils = { version = "0.5", path = "../e-utils", features = ["fs_ext"] }
crossbeam-channel = { version = "0.5", optional = true }
parking_lot = { version = "0.12", optional = true }
thiserror = { version = "2", optional = true }
time = { version = "0.3", features = [
  "formatting",
  "parsing",
], default-features = false, optional = true }
tokio = { version = "1", optional = true }
paste = "1.0"
strum = { version = "0.26", features = ["derive"] }

# If you copy one of the examples into a new project, you should be using
# [dependencies] instead, and delete the **path**.
[dev-dependencies]
e-log = { path = "./", default-features = false, features = [] }
tokio = { version = "1" }
tempfile = "3"
criterion = { version = "0.3.6", default-features = false }

# tag_fn 需要 log 或 tracing 之一（`_tag_any` 即该 OR 的替代表达）；
# 未开时 Cargo 自动跳过，`--examples` 在“无特性”组合下也能过。
[[example]]
name = "tag_fn"
required-features = ["_tag_any"]


[package]
name = "e-log"
version = "0.4.3"
description = "a rust log"
authors = ["Eternal(梦游) <EternalNightYeah2@yeah.net>"]
edition = "2021"
rust-version = "1.76.0"
homepage = "https://gitee.com/eternalnight996"
license-file = "LICENSE"
readme = "README.md"
documentation = "https://docs.rs/e-log"
repository = "https://gitee.com/eternalnight996/e-log"
include = ["src/", "*.md", "LICENSE", "COPYRIGHT", "Cargo.toml"]
keywords = ["log", "tracing", "e-", "frame"]
categories = ["development-tools::debugging"]

[package.metadata.docs.rs]
# RUSTDOCFLAGS="--cfg doc_cfg" cargo +nightly doc --all-features --no-deps --open
rustdoc-args = ["--cfg", "doc_cfg"]
all-features = true
