# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# 设置 crate 类型，有三个选项：`rlib` (Rust library)，`dylib` (dynamic library)，`cdylib` (C-compatible dynamic library)
# 默认是 `rlib`
crate-type = ["rlib"]
proc-macro = false

[features]
_log = ["log"]
log-actix = ["env_logger", "_log"]
tracing-actix = [
  "tracing-actix-web",
  "tracing-bunyan-formatter",
  "_tracing",
  "tracing-log",
  "_tracing-subscriber"
]
_tracing = ["tracing"]
_tracing-subscriber = ["tracing-subscriber"]
_tracing-appender = ["tracing-appender"]
log-tauri = [
  "_log",
  "log/kv_unstable",
  "fern",
  "byte-unit",
  "serde_repr",
  "tauri",
]
tauri-colored = ["fern/colored"]
default = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", default-features = false, optional = true }
serde_repr = { version = "0.1", optional = true }
byte-unit = { version = "5", optional = true }
fern = { version = "0.6", optional = true }
log = { version = "^0.4.21", optional = true }
tracing-actix-web = { version = "0.7", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "registry",
  "json",
], optional = true }
tracing-appender = { version = "0.2", optional = true }
tracing-bunyan-formatter = { version = "0.3", optional = true }
env_logger = { version = "0.11", optional = true }
tracing-log = { version = "0.2", optional = true }
chrono = { version = "0.4" }
e-utils = { version = "0.3.36", path = "../e-utils" }

# If you copy one of the examples into a new project, you should be using
# [dependencies] instead, and delete the **path**.
[dev-dependencies]
e-log = { path = "./", features = [
  "tracing-actix",
  # "log-tauri",
  # "log-actix"
] }
fs2 = "0.4"
actix-web = { version = "4" }

[[example]]
name = "tracing"
path = "examples/tracing.rs"
[[example]]
name = "log"
path = "examples/log.rs"
[[example]]
name = "tracing-actix"
path = "examples/tracing-actix.rs"
[[example]]
name = "log-actix"
path = "examples/log-actix.rs"


[package]
name = "e-log"
version = "0.2.0-alpha.1"
description = "a rust log"
authors = [
  "Eternal Night <EternalNight996@gmail.com, EternalNightYeah2@yeah.net>",
]
edition = "2021"
rust-version = "1.76.0"
homepage = "https://gitee.com/eternalnight996"
license-file = "MIT-LICENSE"
readme = "README.md"
documentation = "https://docs.rs/e-log"
repository = "https://gitee.com/eternalnight996/e-log"
include = ["src/", "*.md", "*-LICENSE", "Cargo.toml"]
keywords = ["log", "tracing", "e-", "tauri"]
categories = ["development-tools::debugging"]

[package.metadata.docs.rs]
# RUSTDOCFLAGS="--cfg doc_cfg" cargo +nightly doc --all-features --no-deps --open
rustdoc-args = ["--cfg", "doc_cfg"]
all-features = true
