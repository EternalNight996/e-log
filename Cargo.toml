# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# 设置 crate 类型，有三个选项：`rlib` (Rust library)，`dylib` (dynamic library)，`cdylib` (C-compatible dynamic library)
# 默认是 `rlib`
crate-type = ["rlib"]
proc-macro = false

[features]
std = ["log"]
trace = ["tracing"]
trace-subscriber = ["tracing-subscriber"]
trace-appender = ["tracing-appender"]
_tauri = [
  "std",
  "time",
  "log/kv_unstable",
  "fern",
  "byte-unit",
  "serde_repr",
  "tauri",
]
tauri-colored = ["fern/colored"]
default = ["std"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6.0", default-features = false, optional = true }
serde_repr = { version = "0.1", optional = true }
byte-unit = { version = "5", optional = true }
fern = { version = "0.6", optional = true }
log = { version = "^0.4.21", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
], optional = true }
tracing-appender = { version = "0.2", optional = true }
time = { version = "0.3", features = [
  "formatting",
  "local-offset",
], optional = true }
e-utils = { version = "0.3" }

[package]
name = "e-log"
version = "0.1.6"
description = "a rust log"
authors = [
  "Eternal Night <EternalNight996@gmail.com, EternalNightYeah2@yeah.net>",
]
edition = "2021"
rust-version = "1.76.0"
homepage = "https://gitee.com/eternalnight996"
license-file = "MIT-LICENSE"
readme = "README.md"
documentation = "https://docs.rs/e-log"
repository = "https://gitee.com/eternalnight996/e-log"
include = ["src/", "*.md", "*-LICENSE", "Cargo.toml"]
keywords = ["log", "tracing", "e-", "tauri"]
categories = ["development-tools::debugging"]

[package.metadata.docs.rs]
# RUSTDOCFLAGS="--cfg doc_cfg" cargo +nightly doc --all-features --no-deps --open
rustdoc-args = ["--cfg", "doc_cfg"]
all-features = true
