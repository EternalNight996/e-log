[lib]
crate-type = ["rlib"]
proc-macro = false

[features]
backtrace = []
built = []
panic = [
  "backtrace",
  "tokio",
  "tokio/sync",
  "parking_lot",
  "e-utils/dialog",
  "windows-sys/Win32_System_Console",
  "windows-sys/Win32_Foundation",
]
log-actix = ["env_logger", "log"]
tracing-actix = ["tracing-actix-web", "tracing"]
tracing-appender = [
  "tracing-subscriber/fmt",
  "tracing-subscriber/std",
  "tracing-subscriber",
  "thiserror",
  "crossbeam-channel",
  "time",
]
log-tauri = [
  "log",
  "log/kv_unstable",
  "fern",
  "byte-unit",
  "serde_repr",
  "tauri",
]
default = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", default-features = false, optional = true }
serde_repr = { version = "0.1", optional = true }
byte-unit = { version = "5", optional = true }
fern = { version = "0.6", optional = true }
log = { version = "^0.4.21", optional = true }
tracing-actix-web = { version = "0.7", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "registry",
  "json",
  "chrono",
], optional = true }
env_logger = { version = "0.11", optional = true }
tracing-log = { version = "0.2", optional = true }
chrono = { version = "0.4" }
e-utils = { version = "0.3.51", features = ["fs_ext"] }
crossbeam-channel = { version = "0.5", optional = true }
parking_lot = { version = "0.12", optional = true }
thiserror = { version = "1", optional = true }
time = { version = "0.3", features = [
  "formatting",
  "parsing",
], default-features = false, optional = true }
tokio = { version = "1", optional = true }

# If you copy one of the examples into a new project, you should be using
# [dependencies] instead, and delete the **path**.
[dev-dependencies]
e-log = { path = "./", features = [
  # "tracing-actix",
  # "tracing-appender",
  # "tracing-subscriber",
  # "log-tauri",
  "panic",
  # "log",
  "tracing",
] }
tauri = { version = "1.6" }
tokio = { version = "1" }
actix-web = { version = "4" }
tempfile = "3"
criterion = { version = "0.3.6", default-features = false }


[package]
name = "e-log"
version = "0.2.1"
description = "a rust log"
authors = [
  "Eternal Night <EternalNight996@gmail.com, EternalNightYeah2@yeah.net>",
]
edition = "2021"
rust-version = "1.78.0"
homepage = "https://gitee.com/eternalnight996"
license-file = "MIT-LICENSE"
readme = "README.md"
documentation = "https://docs.rs/e-log"
repository = "https://gitee.com/eternalnight996/e-log"
include = ["src/", "*.md", "*-LICENSE", "Cargo.toml"]
keywords = ["log", "tracing", "e-", "tauri"]
categories = ["development-tools::debugging"]

[package.metadata.docs.rs]
# RUSTDOCFLAGS="--cfg doc_cfg" cargo +nightly doc --all-features --no-deps --open
rustdoc-args = ["--cfg", "doc_cfg"]
all-features = true
